<html lang="en">

<title>Flow</title>

<style>
  :root { --feed-width: 372px; --feed-bg: rgba(250, 250, 252, 0.86); --track: rgba(120, 120, 130, 0.16); --applied: 52, 168, 96; --shown: 64, 118, 232; --dropped: 214, 76, 64; --silent: 150, 150, 160; }

  :root { --ink: #1c1c1e; --faint: #8e8e96; --note: #9a9aa2; --note-bg: #f0f0f3; --paper: #fbfbfa; --style: 214, 120, 40; --ask-bg: #fff6ea; --ask-ink: #8a4b12; --fix: 60, 150, 90; --thread: 60, 110, 220; --card-bg: #ffffff; --card-edge: #e3e3e8; }

  }

  .count.over { color: rgb(200, 60, 50); font-weight: 600; }

  #feed-toggle {
    position: fixed; top: 14px; right: 14px; z-index: 6; width: 30px; height: 30px; padding: 0; display: grid; place-items: center; cursor: pointer;
    border-radius: 8px; border: 1px solid var(--card-edge); background: var(--card-bg); color: var(--faint); transition: right 0.35s cubic-bezier(0.2, 0.8, 0.2, 1), color 0.2s;
  }

  }

  .feed-call h4 b { color: var(--ink); font-weight: 600; }

  .feed-row { display: grid; grid-template-columns: minmax(0, 1fr) 76px 38px; gap: 10px; align-items: center; padding: 3px 4px; border-radius: 4px; }
  .feed-row .key-name { display: block; font: 500 10.5px "SF Mono", ui-monospace, Menlo, monospace; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .feed-row .value { text-align: left; }
  .track { position: relative; height: 2px; border-radius: 1px; background: var(--track); }
  .track b { position: absolute; inset: 0 auto 0 0; border-radius: 1px; background: rgba(var(--style), 0.55); }
  .track i { position: absolute; top: 50%; width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px; border-radius: 50%; background: rgb(var(--style)); box-shadow: 0 0 6px rgba(var(--style), 0.6); }
  .track i.unsure { background: var(--feed-bg); box-shadow: inset 0 0 0 1.5px rgb(var(--style)); }
  .feed-row.fresh .track b { animation: grow 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) both; animation-delay: calc(var(--index) * 22ms + 80ms); }
  .feed-row .kind { justify-self: end; margin: 0; }
  .feed-row.fresh { animation: slide 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) both; animation-delay: calc(var(--index) * 22ms); }
  .feed-row .value { font: 600 10.5px "SF Mono", ui-monospace, Menlo, monospace; text-align: right; }
  .feed-row .text { font-size: 10.5px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .glyph.ruler i.pick { background: rgb(var(--style)); box-shadow: 0 0 5px rgba(var(--style), 0.6); }
  .glyph.dots { align-items: center; gap: 3px; }
  .glyph.dots i { width: 6px; height: 6px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(var(--style), 0.5); }
  .glyph.dots i.pick { background: rgb(var(--style)); box-shadow: 0 0 5px rgba(var(--style), 0.6); }
  .feed-row .kind { font: 500 8.5px "SF Mono", ui-monospace, Menlo, monospace; letter-spacing: 0.08em; opacity: 0.55; margin-right: 5px; }
  .judged { border-radius: 3px; background: rgba(var(--shown), 0.28); box-shadow: 0 0 0 2px rgba(var(--shown), 0.28); }
  .feed-call { cursor: default; }
  .feed-row.key { background: rgba(var(--shown), 0.1); }
  .feed-row.key .text { color: var(--ink); }
  .feed-more { font-size: 10px; color: var(--faint); padding-left: 112px; }
  .feed-empty { padding: 24px 16px; color: var(--faint); font-size: 11.5px; }
  @keyframes slide { from { opacity: 0; transform: translateX(14px); } }
  @keyframes grow { from { width: 0; } }
  @keyframes rise { from { transform: scaleY(0); } }
  @keyframes acted { 0% { box-shadow: 0 0 0 0 rgba(var(--shown), 0.5); } 100% { box-shadow: 0 0 0 10px rgba(var(--shown), 0); } }
  #reactions { position: absolute; inset: 0; pointer-events: none; }

  }

    content: ""; position: absolute; left: 4px; right: 4px; bottom: -7px; height: 3px; border-radius: 2px; opacity: 0; transition: opacity 0.2s;

  }
  .reaction:hover::after { opacity: 1; }
  @keyframes reaction-in { from { opacity: 0; transform: translateY(-20%) scale(0.6); } }
  #memory { font: 12.5px/1.5 -apple-system, "Helvetica Neue", sans-serif; color: var(--faint); margin: -1.6rem 0 2.4rem; opacity: 0; transition: opacity 0.6s; }

  #memory li { display: flex; align-items: center; gap: 8px; margin: 2px 0; }

  #pages-toggle {
    position: fixed; top: 14px; left: 14px; z-index: 6; width: 30px; height: 30px; padding: 0; display: grid; place-items: center; cursor: pointer;
    border-radius: 8px; border: 1px solid var(--card-edge); background: var(--card-bg); color: var(--faint); font: 15px/1 -apple-system, sans-serif;
  }

  :root {

  }

      --ink: #FEFEFE; --paper: #1E1E1E; --faint: #ABBAB9; --note: #ABBAB9; --note-bg: #3C2D30; --card-bg: #1E1E1E; --card-edge: #DEDEDE; --hairline: #DEDEDE; --track: #1E1E1E; --ask-bg: #DEDEDE; --ask-ink: #1E1E1E;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1E1E1E; --surface: #1E1E1E; --surface-2: #3C2D30; --soft: #DEDEDE; --line: #DEDEDE; --bar-bg: #DEDEDE; --bar-text: #1E1E1E; --fill: #F386A1;
    --ink: #FEFEFE; --paper: #1E1E1E; --faint: #ABBAB9; --note: #ABBAB9; --note-bg: #3C2D30; --card-bg: #1E1E1E; --card-edge: #DEDEDE; --hairline: #DEDEDE; --track: #1E1E1E; --ask-bg: #DEDEDE; --ask-ink: #1E1E1E;

  .pill { background: none; color: var(--accent); text-decoration: underline 1px; text-underline-offset: 3px; }

  #feed-toggle, #pages-toggle { border: 0; border-radius: 0; background: none; color: var(--ink); font: 18px/1 var(--mono); }
  body.feed-open #feed-toggle { color: var(--ink); }
  #feed {
    --feed-bg: #1E1E1E; --ink: #FEFEFE; --faint: #ABBAB9; --track: #3C2D30; --card-edge: #3C2D30; --style: 243, 134, 161; --shown: 243, 134, 161; --applied: 3, 170, 92; --dropped: 171, 186, 185; --silent: 60, 45, 48;
    background: var(--feed-bg); backdrop-filter: none; -webkit-backdrop-filter: none; border-left: 2px solid #1E1E1E; font: 13px/1.3 var(--sans);
  }
  .feed-totals { background: #DEDEDE; color: #1E1E1E; backdrop-filter: none; -webkit-backdrop-filter: none; border-bottom: 0; padding: 8px 16px; }
  .feed-totals div { font: 12px var(--mono); letter-spacing: 0; text-transform: none; color: #3C2D30; }
  .feed-totals b { font: 400 21px/1.1 var(--sans); letter-spacing: -0.02em; color: #1E1E1E; }

  .dot, .strip i, .track, .track b, .track i, .glyph.ruler i, .glyph.dots i, .feed-row { border-radius: 0; box-shadow: none; }
  .dot.applied, .dot.shown, .glyph.ruler i.pick, .glyph.dots i.pick, .track i { box-shadow: none; }
  .dot.silent { box-shadow: inset 0 0 0 2px rgb(var(--silent)); }
  .feed-call, .feed-call.applied, .feed-call.shown { border-radius: 0; border-left: 0; background: none; padding: 4px 0; }
  .feed-call h4 { font: 13px var(--mono); color: var(--faint); }
  .feed-call h4 b { color: #F386A1; font-weight: 400; }
  .feed-row .key-name { color: #F386A1; font-size: 12px; }
  .feed-row .text { font-style: normal; color: #FEFEFE; font-size: 12px; }
  .feed-row.key { background: #3C2D30; }
  .track { height: 5px; background: #3C2D30; }
  .track b { background: #F386A1; }

  @keyframes acted { from { background: #3C2D30; } }
  #pages { display: flex; flex-direction: column; background: var(--surface); backdrop-filter: none; -webkit-backdrop-filter: none; border-right: var(--rule); font: 14px/1.4 var(--sans); }
  #new-page { margin-bottom: 12px; padding: 4px 8px; border-bottom: var(--rule); color: var(--ink); font: 13px/1.4 var(--mono); }

  #component-list li::before { content: ""; flex: none; width: 8px; height: 8px; box-sizing: border-box; border: 1px solid var(--ink); background: var(--accent); }

<body>
<div class="page">
  <div id="headers" data-ref="component:notes" data-ref-data="the header lines: the goal, audience, tone and to do notes lifted from the draft"></div>
  <div id="gauges" data-ref="component:gauges" data-ref-data="the Impact box: rings scoring the draft on what matters for your Goal"></div>
  <div id="memory" data-ref="component:memory" data-ref-data="the memory box: facts jevflow knows about you"></div>
  <div class="sheet">
    <div id="backdrop" class="layer" aria-hidden="true"></div>
    <textarea id="editor" class="layer" spellcheck="false" autofocus placeholder="just write. tell me what it's for as you go."></textarea>
    <div id="asks"></div>
    <div id="comments" data-ref="component:replies" data-ref-data="the margin comment: the coworker's reply to your question"></div>
    <div id="reactions" data-ref="component:reactions" data-ref-data="the emoji reactions beside lines that land"></div>
    <div id="probes" data-ref="component:probes" data-ref-data="the rings answering your yes/no questions about copied text"></div>
    <div id="claims" data-ref="component:claims" data-ref-data="the rings on claims that read as false, with a one-click fix"></div>
  </div>
</div>
<button id="feed-toggle" tabindex="-1" title="Decisions (Cmd+J)" aria-label="Decisions"><svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><rect x="1" y="7" width="2.4" height="6"/><rect x="5.8" y="2" width="2.4" height="11"/><rect x="10.6" y="5" width="2.4" height="8"/></svg></button>
<i id="saved" aria-hidden="true"></i>
<button id="pages-toggle" tabindex="-1" title="Pages" aria-label="Pages">≡</button>
<nav id="pages" aria-label="Pages"><button id="new-page" tabindex="-1" title="New page" aria-label="New page">new page</button><ul id="page-list"></ul><section id="components-panel" aria-label="Components"><h3>components</h3><ul id="component-list"></ul></section></nav>
<aside id="feed" aria-label="Decisions" data-ref="component:feed" data-ref-data="the decisions column: every decision, live">
  <div class="feed-totals">
    <div><b><span id="feed-decisions">0</span><small id="feed-replays"></small></b>decisions</div>
    <div><b id="feed-median">0.00s</b>median call</div>
    <div><b id="feed-dollars">$0.000</b>cost</div>
    <div class="feed-legend"><span><i class="dot applied"></i> applied</span><span><i class="dot shown"></i> shown</span><span><i class="dot dropped"></i> dropped</span><span><i class="dot silent"></i> silent</span></div>
  </div>
  <div id="feed-pauses"><div class="feed-empty">Pause while typing: every decision lands here.</div></div>
</aside>
<script>
const FIELDS = { goal: "Goal", audience: "Audience", tone: "Tone", to_do: "To do" };
const MAX_OPEN_QUESTIONS = 3;
const MAX_REACTIONS = 3;
const FLASH_MS = 1200;
const MARGIN_GAP = 6;
const editor = document.getElementById("editor");
const backdrop = document.getElementById("backdrop");
const asksLayer = document.getElementById("asks");
const headersBox = document.getElementById("headers");
const commentsLayer = document.getElementById("comments");
const reactionsLayer = document.getElementById("reactions");
const THREAD_FADE_SENTENCES = 2;
let thread = null;
let notes = [], insights = [], headers = [], history = [], flashes = [], reactions = [];
const declined = new Set();
let timing = null, pendingFixes = [], pendingSuggestions = [];
const settled = () => timing !== null && timing.mid_thought < 0.5 && timing.interrupt >= 0.3;
const RETRY_MS = 2000, REQUEST_TIMEOUT_MS = 15000;
let notesTimer, insightsTimer, fixesTimer, notesRequest = 0, insightsRequest = 0, fixesRequest = 0;

const escape = (text) => text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

function typingStart() {
  const before = editor.value.slice(0, editor.selectionStart);
  const match = before.match(/[\s\S]*[.!?\n]/);
  return match ? match[0].length : 0;
}

function stillThere(item) {
  return editor.value.slice(item.start, item.end) === item.text;
}

function openQuestions() {
  if (!settled()) return [];
  const limit = typingStart();
  return insights.filter((insight) => insight.ask && insight.end <= limit && stillThere(insight))
    .sort((first, second) => second.probability - first.probability).slice(0, MAX_OPEN_QUESTIONS);
}

let pendingToggles = [], metaSpans = [], mashSpans = [];

function contentText() {
  let text = editor.value;
  for (const span of [...notes, ...pendingToggles, ...metaSpans, ...mashSpans, ...refSpans(text, REF_SPAN)].filter(stillThere)) text = text.slice(0, span.start) + " ".repeat(span.end - span.start) + text.slice(span.end);
  return text;
}

function render() {
  const text = editor.value;
  const marks = [];
  if (thread && stillThere(thread.anchor)) marks.push({ start: thread.anchor.start, end: thread.anchor.end, open: '<span class="anchor" data-thread="1">' });
  if (judged && stillThere(judged)) marks.push({ start: judged.start, end: judged.end, open: '<span class="judged">' });
  for (const flash of flashes.filter(stillThere)) marks.push({ start: flash.start, end: flash.end, open: '<span class="fixed">' });
  for (const probe of probes) {
    if (marks.some((mark) => mark.start < probe.end && probe.start < mark.end)) continue;
    marks.push({ start: probe.start, end: probe.end, open: `<span class="probed" data-probe="${probe.id}">` });
  }
  for (const pill of refSpans(text, REF_TOKEN)) {
    if (marks.some((mark) => mark.start < pill.end && pill.start < mark.end)) continue;
    marks.push({ start: pill.start, end: pill.end, open: '<span class="pill">' });
  }
  for (const claim of claims.filter(stillThere)) {
    if (marks.some((mark) => mark.start < claim.end && claim.start < mark.end)) continue;
    marks.push({ start: claim.start, end: claim.end, open: `<span class="claimed" data-claim="${claim.start}">` });
  }
  for (const note of [...notes, ...pendingToggles, ...metaSpans].filter(stillThere)) {
    if (marks.some((mark) => mark.start < note.end && note.start < mark.end)) continue;
    marks.push({ start: note.start, end: note.end, open: '<span class="meta">' });
  }
  for (const insight of insights.filter(stillThere)) {
    if (marks.some((mark) => mark.start < insight.end && insight.start < mark.end)) continue;
    const alpha = (0.06 + 0.28 * (insight.probability - 0.5) * 2).toFixed(2);
    marks.push({ start: insight.start, end: insight.end, open: `<span class="flag" data-insight="${insight.start}" style="background: rgba(var(--style), ${alpha})">` });
  }
  marks.sort((first, second) => first.start - second.start);
  let html = "", cursor = 0;
  for (const mark of marks) {
    if (mark.start < cursor) continue;
    html += escape(text.slice(cursor, mark.start)) + mark.open + escape(text.slice(mark.start, mark.end)) + "</span>";
    cursor = mark.end;
  }
  backdrop.innerHTML = html + escape(text.slice(cursor)) + "​";
  editor.style.height = "auto";
  editor.style.height = Math.max(editor.scrollHeight, backdrop.scrollHeight) + "px";
  const sheet = asksLayer.getBoundingClientRect();
  asksLayer.innerHTML = "";
  for (const insight of openQuestions()) {
    const span = backdrop.querySelector(`[data-insight="${insight.start}"]`);
    if (!span) continue;
    const first = span.getClientRects()[0];
    const label = document.createElement("button");
    label.type = "button";
    label.tabIndex = -1;
    label.className = insight.kept ? "ask kept" : "ask";
    label.dataset.start = insight.start;
    label.dataset.ref = `insight:${insight.start}`;
    label.dataset.refData = `${insight.reasons.join(" · ")} ${Math.round(100 * insight.probability)}%`;
    label.innerHTML = `<b class="percent">${Math.round(100 * insight.probability)}%</b>${escape(insight.ask)}<small>${escape(insight.reasons.join(" · "))}</small>`;
    label.style.top = `${first.top - sheet.top + 2}px`;
    asksLayer.appendChild(label);
    label.style.left = `${Math.max(0, Math.min(first.left - sheet.left, sheet.width - label.offsetWidth))}px`;
  }
  renderThread(sheet);
  renderReactions(sheet);
  renderProbes(sheet);
  renderClaims(sheet);
  stackMargin(sheet);
  headersBox.innerHTML = Object.entries(FIELDS).map(([field, name]) => {
    const entries = headers.filter((header) => header.field === field).map((header, index) => `<span data-ref="${field}:${index + 1}">${escape(header.text)}</span>`);
    return entries.length ? `<div data-ref="header:${field}"><b>${name}:</b>${entries.join("; ")}</div>` : "";
  }).join("");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(savePage, SAVE_MS);
}

function stackMargin(sheet) {
  const edge = window.innerWidth - (document.body.classList.contains("feed-open") ? document.getElementById("feed").offsetWidth : 0);
  const elements = [...document.querySelectorAll("#comments > .card, #probes > .probe, #claims > .claim, #reactions > .reaction")];
  for (const element of elements) {
    element.style.translate = "";
    const rect = element.getBoundingClientRect();
    element.classList.toggle("below", rect.right > edge);
    if (rect.right <= edge) continue;
    element.style.translate = `${sheet.right - rect.right}px 0`;
    element.style.top = `${parseFloat(element.style.top) + sheet.top + Number(element.dataset.line) + MARGIN_GAP - rect.top}px`;
  }
  const placed = [];
  const items = elements
    .map((element) => ({ element, rect: element.getBoundingClientRect() }))
    .sort((first, second) => first.rect.top - second.rect.top);
  for (const { element, rect } of items) {
    const floor = Math.max(rect.top, ...placed.filter((other) => other.left < rect.right && rect.left < other.right).map((other) => other.bottom + MARGIN_GAP));
    element.style.top = `${parseFloat(element.style.top) + floor - rect.top}px`;
    placed.push({ left: rect.left, right: rect.right, bottom: rect.bottom + floor - rect.top });
  }
}

function renderThread(sheet) {
  commentsLayer.innerHTML = "";
  if (!thread) return;
  const span = backdrop.querySelector("[data-thread]");
  if (!span) return;
  const card = document.createElement("div");
  card.className = thread.kept ? "card shake" : "card";
  card.dataset.ref = `thread:${slug(thread.question || thread.answer || "open")}`;
  const lines = thread.question ? [`<p><b>You</b>${escape(thread.question)}</p>`] : [];
  const page = thread.page ? ` <span class="page-link" data-page="${attribute(thread.page.id)}" data-ref="page:${attribute(thread.page.id)}" data-ref-data="${attribute(thread.page.title)}">${escape(thread.page.title)}</span>` : "";
  lines.push(`<p class="coworker"><b>jevflow</b>${thread.answer === undefined ? '<span class="status">thinking…</span>' : `${escape(thread.answer)}${page}<span class="measures"></span>`}</p>`);
  if (thread.reply) lines.push(`<p><b>You</b>${escape(thread.reply)}</p>`);
  if (thread.status) lines.push(`<p class="status">${escape(thread.status)}</p>`);
  card.innerHTML = lines.join("");
  const slot = card.querySelector(".measures");
  if (slot && thread.measures) {
    if (!thread.rings) { thread.rings = Object.assign(document.createElement("div"), { className: "rings" }); thread.ref = ++threadRefs; }
    for (const measure of thread.measures) {
      let ring = [...thread.rings.children].find((element) => element.dataset.name === measure.label);
      if (!ring) { ring = createRing(measure.label, `gauge:${thread.ref}-${measure.label}`); ring.classList.add("mini"); thread.rings.appendChild(ring); }
      setRing(ring, measure.probability, measure.question);
    }
    slot.replaceWith(thread.rings);
  }
  const rects = span.getClientRects();
  card.style.top = `${rects[0].top - sheet.top - 4}px`;
  card.dataset.line = rects[rects.length - 1].bottom - sheet.top;
  commentsLayer.appendChild(card);
}

function characterRect(offset) {
  const walker = document.createTreeWalker(backdrop, NodeFilter.SHOW_TEXT);
  let remaining = offset;
  for (let node = walker.nextNode(); node; node = walker.nextNode()) {
    if (remaining < node.length) {
      const range = document.createRange();
      range.setStart(node, remaining);
      range.setEnd(node, remaining + 1);
      return range.getClientRects()[0];
    }
    remaining -= node.length;
  }
  return null;
}

function renderReactions(sheet) {
  const text = editor.value;
  const caret = editor.selectionStart;
  for (const gone of reactions.filter((reaction) => !stillThere(reaction))) gone.element?.remove();
  reactions = reactions.filter(stillThere);
  for (const reaction of reactions) {
    const rect = characterRect(reaction.end - 1);
    if (!rect) continue;
    if (!reaction.element) {
      reaction.element = document.createElement("div");
      reaction.element.className = "reaction";
      reaction.element.textContent = reaction.emoji;
      reaction.element.style.setProperty("--probability", reaction.probability);
      reactionsLayer.appendChild(reaction.element);
    }
    const lineStart = text.lastIndexOf("\n", reaction.start - 1) + 1;
    const lineEnd = text.indexOf("\n", reaction.end) < 0 ? text.length : text.indexOf("\n", reaction.end);
    const endsLine = !text.slice(reaction.end, lineEnd).trim() && (caret < lineStart || caret > lineEnd);
    reaction.element.style.left = `${endsLine ? Math.min(rect.right - sheet.left + 6, sheet.width + 4) : sheet.width + 4}px`;
    reaction.element.style.top = `${rect.top - sheet.top + rect.height / 2}px`;
    reaction.element.dataset.line = rect.bottom - sheet.top;
    reaction.element.dataset.ref = `reaction:${reaction.start}`;
    reaction.element.dataset.refData = `${reaction.emoji} on '${reaction.text}', P=${reaction.probability.toFixed(2)}`;
  }
}

function previousSentence(text, position) {
  const before = text.slice(0, position).trimEnd();
  const boundary = before.slice(0, -1).search(/[.!?\n][^.!?\n]*$/);
  let start = boundary + 1;
  while (/\s/.test(before[start] || "")) start += 1;
  return { start, end: before.length, text: before.slice(start) };
}

function sentencesAfter(position) {
  return (editor.value.slice(position, typingStart()).match(/[.!?\n]/g) || []).length;
}

const SEARCH_STOPWORDS = new Set("i me my mine we us our is it to of in on at a an the and did said say what where when who how about into from that this with have had was were you your yours for are can could would should there their them then than take bring open show find wrote write written page pages one some".split(" "));

async function searchPages(note) {
  const words = [...new Set((note.text.toLowerCase().match(/[a-z0-9']+/g) || []).filter((word) => !SEARCH_STOPWORDS.has(word)).map((word) => word.length > 5 ? word.replace(/(ing|ed|es|s)$/, "") : word))];
  const hits = (line) => words.filter((word) => new RegExp(`\\b${word}`).test(line.toLowerCase())).length;
  const candidates = Object.entries(readPages()).filter(([id]) => id !== currentPage).map(([id, page]) => {
    const lines = [page.title, ...page.state.text.split(/\n|(?<=[.!?])\s+/).filter((line) => line.trim() && !declined.has(`note ${line.trim()}`) && line.trim() !== note.text)];
    const line = lines.reduce((best, other) => hits(other) > hits(best) ? other : best);
    return { id, title: page.title, line, score: hits(page.title) + hits(line) };
  }).filter((candidate) => candidate.score > 0).sort((first, second) => second.score - first.score).slice(0, 8);
  const anchor = { start: note.start, end: note.end, text: note.text };
  thread = { anchor, question: note.text };
  const opened = thread;
  render();
  const found = await post("/pages/search", { question: note.text, open: note.field === "open", candidates: candidates.map(({ id, title, line }) => ({ id, title, line })) });
  if (thread !== opened) return;
  if (!found.id) {
    thread.answer = "can't find that in your other pages";
    render();
    return;
  }
  if (note.field === "open") {
    const [start, end] = removalRange(editor.value, anchor);
    if (stillThere(anchor)) replaceAll(editor.value.slice(0, start) + editor.value.slice(end), start);
    thread = null;
    loadPage(found.id, readPages()[found.id].state);
    return;
  }
  thread.answer = found.line === found.title ? "that's this page:" : `you wrote "${found.line.trim()}" in`;
  thread.page = { id: found.id, title: found.title };
  thread.measures = [{ label: "answers it", probability: found.probability, question: "Does this page answer your question?" }];
  render();
}

commentsLayer.addEventListener("click", (event) => {
  const id = event.target.closest(".page-link")?.dataset.page;
  const page = id && readPages()[id];
  if (page) loadPage(id, page.state);
});

async function openThread(anchor, question) {
  thread = { anchor, question };
  const goal = headers.find((header) => header.field === "goal");
  const opened = thread;
  const paragraphStart = editor.value.lastIndexOf("\n", anchor.start - 1) + 1;
  const paragraph = { start: paragraphStart, end: anchor.end, text: editor.value.slice(paragraphStart, anchor.end) };
  const content = contentText();
  const plain = (start, end) => content.slice(start, end).replace(/\s+/g, " ").trim();
  const result = await post("/answer", { sentence: plain(anchor.start, anchor.end), paragraph: plain(paragraphStart, anchor.end), question, goal: goal ? goal.text : "", disabled: [...disabled] });
  if (thread !== opened) return;
  if (!result.text) {
    thread = null;
    render();
    return;
  }
  if (result.scope === "paragraph") thread.anchor = paragraph;
  thread.answer = result.text;
  thread.measures = result.measures;
  render();
}

async function rewriteInsight(insight, label) {
  label.classList.add("rewriting");
  const draft = editor.value;
  const { rewrite } = await post("/rewrite", { sentence: insight.text, pattern: insight.reasons[0] });
  if (!rewrite || editor.value !== draft) { insight.kept = true; render(); return; }
  applyEdit(insight.start, insight.end, rewrite.text, `revise ${insight.text} ${rewrite.text}`);
  insights = insights.filter((other) => other !== insight);
  const flash = { start: insight.start, end: insight.start + rewrite.text.length, text: rewrite.text };
  flashes.push(flash);
  setTimeout(() => { flashes = flashes.filter((other) => other !== flash); render(); }, FLASH_MS);
  render();
}

asksLayer.addEventListener("mousedown", (event) => { if (event.target.closest(".ask")) event.preventDefault(); });
asksLayer.addEventListener("click", (event) => {
  const label = event.target.closest(".ask");
  const insight = label && insights.find((other) => String(other.start) === label.dataset.start);
  if (insight) rewriteInsight(insight, label);
});

async function replyToThread(reply) {
  const replied = thread;
  thread.reply = reply;
  thread.status = "…";
  render();
  const result = await post("/revise", { sentence: thread.anchor.text, comment: thread.comment || thread.answer, reply, proposed: thread.replacement || "" });
  if (thread !== replied) return;
  if (!result.replacement || !stillThere(thread.anchor)) {
    thread.status = "✋";
    thread.kept = true;
    render();
    setTimeout(() => { replied.kept = false; }, 400);
    return;
  }
  const { start, end } = thread.anchor;
  applyEdit(start, end, result.replacement, `revise ${thread.anchor.text} ${result.replacement}`);
  thread.anchor = { start, end: start + result.replacement.length, text: result.replacement };
  thread.status = "✅";
  const flash = { ...thread.anchor };
  flashes.push(flash);
  setTimeout(() => { flashes = flashes.filter((other) => other !== flash); render(); }, FLASH_MS);
  render();
}

function suggest(suggestions) {
  const suggestion = suggestions.find((other) => stillThere(other) && !declined.has(`suggest ${other.text}`) && !notes.some((note) => note.start < other.end && other.start < note.end));
  if (!suggestion) return;
  declined.add(`suggest ${suggestion.text}`);
  thread = {
    anchor: { start: suggestion.start, end: suggestion.end, text: suggestion.text }, question: "", comment: suggestion.comment, answer: `${suggestion.comment} “${suggestion.replacement}”`,
    measures: suggestion.measures, replacement: suggestion.replacement, status: 'Type "ok" to apply.',
  };
}

const DISABLED_KEY = "jevflow.disabled";
let components = {};
let disabled = new Set();
try { disabled = new Set(JSON.parse(localStorage.getItem(DISABLED_KEY)) || []); } catch {}
fetch("/components").then((response) => response.json()).then((registry) => {
  components = registry;
  document.getElementById("feed-toggle").hidden = !isOn("feed");
  window.dispatchEvent(new CustomEvent("components-loaded"));
});

function isOn(name) {
  return !disabled.has(name);
}

function setComponent(name, on) {
  if (on) disabled.delete(name);
  else disabled.add(name);
  try { localStorage.setItem(DISABLED_KEY, JSON.stringify([...disabled])); } catch {}
  if (!on && name === "reactions") { for (const reaction of reactions) reaction.element?.remove(); reactions = []; }
  if (!on && name === "flags") insights = [];
  if (!on && name === "corrections") { pendingFixes = []; pendingSuggestions = []; }
  if (!on && name === "gauges") { gauges = []; gaugesBox.innerHTML = ""; }
  if (!on && name === "memory") renderMemory({ facts: [], recalled: [] });
  if (!on && name === "replies") thread = null;
  if (!on && name === "feed" && document.body.classList.contains("feed-open")) toggleFeed();
  document.getElementById("feed-toggle").hidden = !isOn("feed");
  if (on && name === "gauges") refreshGauges();
  render();
  window.dispatchEvent(new CustomEvent("component-toggle", { detail: { name, on } }));
}

const lastRequests = new Map();

function post(path, body) {
  const serialized = JSON.stringify(body);
  const last = lastRequests.get(path);
  if (last && last.serialized === serialized) return last.result;
  const result = fetch(path, { method: "POST", headers: { "Content-Type": "application/json", "X-Pause": `${PAGE_LOAD} ${inputs}` }, body: serialized, signal: AbortSignal.timeout(REQUEST_TIMEOUT_MS) }).then((response) => {
    if (!response.ok) throw new Error(`${path} ${response.status}`);
    return response.json();
  });
  result.catch(() => { if (lastRequests.get(path)?.result === result) lastRequests.delete(path); });
  lastRequests.set(path, { serialized, result });
  return result;
}

function replaceAll(text, caret) {
  editor.focus();
  editor.select();
  document.execCommand("insertText", false, text);
  editor.setSelectionRange(caret, caret);
}

function applyEdit(start, end, replacement, key) {
  const before = editor.value;
  history.push({ key, headers: headers.slice(), start, inserted: replacement, removed: before.slice(start, end), context: before.slice(Math.max(0, start - 40), start) });
  const caret = editor.selectionStart;
  const shift = replacement.length - (end - start);
  for (const reaction of reactions) if (reaction.text === before.slice(start, end)) reaction.text = replacement;
  replaceAll(before.slice(0, start) + replacement + before.slice(end), caret >= end ? caret + shift : caret);
}

function undo() {
  const previous = history.pop();
  if (!previous) return;
  declined.add(previous.key);
  if (/^(fix|revise) /.test(previous.key)) post("/memory/undo", { draft: headers.map((header) => header.text).concat(editor.value).join("\n"), before: previous.removed, after: previous.inserted }).then(renderMemory);
  headers = previous.headers;
  const text = editor.value;
  const found = text.indexOf(previous.context + previous.inserted, Math.max(0, previous.start - previous.context.length - 200));
  const start = (found >= 0 ? found : text.indexOf(previous.context + previous.inserted)) + previous.context.length;
  if (start < previous.context.length) return;
  const end = start + previous.inserted.length;
  const caret = editor.selectionStart;
  const shift = previous.removed.length - previous.inserted.length;
  replaceAll(text.slice(0, start) + previous.removed + text.slice(end), caret >= end ? caret + shift : caret);
}

function removalRange(text, note) {
  let start = note.start, end = note.end;
  const before = text.slice(0, start).trimEnd();
  if (before === "" || /[.!?\n]$/.test(before)) {
    if (/[.!?]/.test(text[end] || "")) end += 1;
    while (text[end] === " ") end += 1;
    if (text[end] === "\n" && (start === 0 || text[start - 1] === "\n")) end += 1;
    return [start, end];
  }
  while (start > 0 && text[start - 1] === " ") start -= 1;
  return [start, end];
}

function clipToThread(note) {
  if (!thread || !stillThere(thread.anchor) || note.end <= thread.anchor.start || note.start >= thread.anchor.end) return note;
  let start = thread.anchor.end;
  while (/\s/.test(editor.value[start] || "")) start += 1;
  if (start >= note.end) return null;
  return { ...note, start, text: editor.value.slice(start, note.end) };
}

function liftNotes() {
  const limit = typingStart();
  const typedPast = (note) => note.end <= limit || (note.field === "undo" && /^\s+$/.test(editor.value.slice(note.end, editor.selectionStart)));
  const ready = notes.filter((note) => stillThere(note) && typedPast(note) && !refSpans(editor.value.slice(0, note.start).match(/[^.!?\n]*$/)[0] + note.text, REF_TOKEN).length && !declined.has(`note ${note.text}`)).sort((first, second) => second.start - first.start);
  for (const found of ready) {
    notes = notes.filter((other) => other !== found);
    const note = clipToThread(found);
    if (!note) continue;
    if ((note.field === "question" || note.field === "reply") && !isOn("replies")) continue;
    if (note.field === "new_page" && !isOn("pages")) continue;
    if (FIELDS[note.field] && !isOn("notes")) continue;
    if (note.field === "question" || note.field === "reply") {
      const anchor = previousSentence(editor.value, note.start);
      if (note.field === "question" && !anchor.text) continue;
      const [start, end] = removalRange(editor.value, note);
      applyEdit(start, end, "", `note ${note.text}`);
      if (note.field === "reply" && thread && thread.answer) replyToThread(note.text);
      else if (note.field === "question" && anchor.text) openThread(anchor, note.text);
      continue;
    }
    if (note.field === "find" || note.field === "open") {
      declined.add(`note ${note.text}`);
      searchPages(note);
      continue;
    }
    if (note.field === "undo") {
      const [start, end] = removalRange(editor.value, note);
      replaceAll(editor.value.slice(0, start) + editor.value.slice(end), start);
      undo();
      continue;
    }
    if (note.field === "new_page" && note.headers.some((header) => header.field === "goal" && header.text.trim().toLowerCase() === currentGoal().trim().toLowerCase())) continue;
    if (note.field === "new_page") {
      const [start, end] = removalRange(editor.value, note);
      replaceAll(editor.value.slice(0, start) + editor.value.slice(end), start);
      openNewPage(note.headers);
      return;
    }
    const [start, end] = removalRange(editor.value, note);
    applyEdit(start, end, "", `note ${note.text}`);
    headers.push(...note.headers);
  }
  if (ready.length) insights = [];
  if (thread && thread.answer !== undefined && !thread.reply && sentencesAfter(thread.anchor.end) >= THREAD_FADE_SENTENCES) thread = null;
}

async function findNotes() {
  const text = editor.value;
  if (!text.trim()) return renderMemory({ facts: [], recalled: [] });
  const request = ++notesRequest;
  const comment = thread && thread.answer && !thread.reply ? thread.answer : "";
  const breaks = thread && stillThere(thread.anchor) ? [thread.anchor.end] : [];
  const result = await post("/notes", { text, comment, breaks, goal: currentGoal(), disabled: [...disabled] }).catch(() => null);
  if (!result) { refreshGauges(); notesTimer = setTimeout(findNotes, RETRY_MS); return; }
  if (request !== notesRequest || editor.value !== text) return;
  notes = result.notes;
  timing = result.timing;
  if (isOn("memory")) renderMemory(result.memory);
  const limit = typingStart();
  pendingToggles = result.toggles;
  metaSpans = result.meta;
  mashSpans = result.mash.map((span) => ({ ...span, end: span.start + text.slice(span.start, span.end).trimEnd().length, text: text.slice(span.start, span.end).trimEnd() }));
  const content = contentText();
  claims = result.claims.filter((claim) => claim.end <= limit && content.slice(claim.start, claim.end) === claim.text);
  const mash = mashSpans.find((span) => span.end <= limit && !declined.has(`mash ${span.comment}`));
  if (mash && !thread) {
    declined.add(`mash ${mash.comment}`);
    thread = { anchor: { start: mash.start, end: mash.end, text: mash.text }, question: "", answer: mash.comment, measures: [{ label: "keyboard mash", question: mash.question, probability: mash.probability }] };
  }
  for (const toggle of result.toggles) {
    if (toggle.end > limit || editor.value.slice(toggle.start, toggle.end) !== toggle.text) continue;
    const [from, to] = removalRange(editor.value, toggle);
    replaceAll(editor.value.slice(0, from) + editor.value.slice(to), from);
    setComponent(toggle.component, toggle.on);
  }
  for (const reaction of result.reactions) {
    if (reactions.length < MAX_REACTIONS && reaction.end <= limit && !reactions.some((other) => other.text === reaction.text)) reactions.push(reaction);
  }
  applyPendingFixes();
  liftNotes();
  render();
  rescoreProbes();
  const settledLimit = typingStart();
  refSpans(editor.value, REF_SPAN).filter((span) => !handledRefs.has(span.text) && (span.end <= settledLimit || result.timing.mid_thought < 0.5)).forEach(handleRef);
  refreshGauges();
  if (editor.value !== text) insightsTimer = setTimeout(findInsights, 300);
}

async function findFixes() {
  if (!isOn("corrections")) return;
  const text = editor.value;
  const limit = typingStart();
  if (!text.slice(0, limit).trim()) return;
  const request = ++fixesRequest;
  const result = await post("/fixes", { text: contentText(), limit, goal: currentGoal() });
  if (request !== fixesRequest || editor.value !== text) return;
  const anchored = (fix) => thread && stillThere(thread.anchor) && fix.start < thread.anchor.end && thread.anchor.start < fix.end;
  const clear = result.fixes.filter((fix) => !declined.has(`fix ${fix.text} ${fix.replacement}`) && !anchored(fix) && !notes.some((note) => note.start < fix.end && fix.start < note.end));
  pendingFixes = clear;
  pendingSuggestions = result.suggestions;
  applyPendingFixes();
}

function applyPendingFixes() {
  if (!settled()) return;
  const ready = pendingFixes.filter((fix) => editor.value.slice(fix.start, fix.end) === fix.text);
  pendingFixes = [];
  for (const fix of ready.sort((first, second) => second.start - first.start)) {
    applyEdit(fix.start, fix.end, fix.replacement, `fix ${fix.text} ${fix.replacement}`);
    const flash = { start: fix.start, end: fix.start + fix.replacement.length, text: fix.replacement };
    flashes.push(flash);
    setTimeout(() => { flashes = flashes.filter((other) => other !== flash); render(); }, FLASH_MS);
  }
  if (!ready.length && !thread) suggest(pendingSuggestions);
  pendingSuggestions = [];
  render();
}

async function findInsights() {
  if (!isOn("flags")) return;
  const text = editor.value;
  if (!text.trim()) return;
  const request = ++insightsRequest;
  const result = await post("/insights", { text: contentText() });
  if (request !== insightsRequest || editor.value !== text) return;
  insights = result.insights.map((insight) => ({ ...insight, text: text.slice(insight.start, insight.end) }));
  render();
}

const gaugesBox = document.getElementById("gauges");
const GAUGE_LEVELS = [[0.2, "weak"], [0.4, "shaky"], [0.6, "so-so"], [0.8, "good"], [1.01, "strong"]];
const GAUGE_RING = 2 * Math.PI * 21;
const GAUGE_FADE_MS = 500;
const DELTA_MS = 2500;
let gauges = [], gaugeLimit = null, gaugeBrief = "", gaugesRequest = 0;
const gaugeTimings = [];
let threadRefs = 0;
const graphemes = new Intl.Segmenter();

function latestHeader(field) {
  const entries = headers.filter((header) => header.field === field);
  return entries.length ? entries[entries.length - 1].text : "";
}

function currentGoal() {
  return latestHeader("goal");
}

function levelWord(probability) {
  return GAUGE_LEVELS.find(([ceiling]) => probability < ceiling)[1];
}

function createRing(name, reference) {
  const element = document.createElement("div");
  element.className = "gauge entering";
  element.dataset.name = name;
  element.dataset.ref = reference;
  element.innerHTML = `<svg viewBox="0 0 52 52"><circle class="track" cx="26" cy="26" r="21" fill="none" stroke-width="5"/><circle class="level" cx="26" cy="26" r="21" fill="none" stroke-width="5" stroke-linecap="round" stroke-dasharray="${GAUGE_RING}" stroke-dashoffset="${GAUGE_RING}"/></svg><span class="value">0%</span><span class="delta"></span><span class="name">${escape(name)}</span><span class="tip"></span>`;
  element.shown = 0;
  element.target = null;
  return element;
}

function setRing(element, probability, question) {
  element.getBoundingClientRect();
  element.classList.remove("entering");
  const percent = Math.round(100 * probability);
  element.querySelector(".tip").innerHTML = `“${escape(question)}”<br>${percent}% yes · ${levelWord(probability)}`;
  element.dataset.refData = `${percent}% yes on "${question}"`;
  if (element.target === probability) return;
  const change = element.target === null ? 0 : percent - Math.round(100 * element.target);
  element.target = probability;
  const ring = element.querySelector(".level");
  ring.style.strokeDashoffset = `${GAUGE_RING * (1 - probability)}px`;
  tweenValue(element, probability);
  if (!change) return;
  const delta = element.querySelector(".delta");
  delta.textContent = change > 0 ? `▲ ${change}` : `▼ ${-change}`;
  delta.className = `delta shown ${change > 0 ? "up" : "down"}`;
  element.classList.add("pulse");
  clearTimeout(element.deltaTimer);
  element.deltaTimer = setTimeout(() => { delta.classList.remove("shown"); element.classList.remove("pulse"); }, DELTA_MS);
}

function renderGauges() {
  if (!currentGoal() || !isOn("gauges")) { gaugesBox.innerHTML = ""; return; }
  for (const gauge of gauges) {
    let element = gaugesBox.querySelector(`.gauge[data-name="${CSS.escape(gauge.name)}"]:not(.leaving)`);
    if (!element) {
      element = createRing(gauge.name, `gauge:${gauge.name}`);
      gaugesBox.insertBefore(element, gaugesBox.querySelector(".count"));
    }
    setRing(element, gauge.probability, gauge.question);
  }
  for (const element of [...gaugesBox.querySelectorAll(".gauge:not(.leaving)")]) {
    if (gauges.some((gauge) => gauge.name === element.dataset.name)) continue;
    element.classList.add("leaving");
    setTimeout(() => element.remove(), GAUGE_FADE_MS);
  }
  let count = gaugesBox.querySelector(".count");
  if (gaugeLimit && !count) { count = document.createElement("div"); count.className = "count"; gaugesBox.appendChild(count); }
  if (!gaugeLimit && count) count.remove();
  if (gaugeLimit) {
    const length = textLength(contentText().replace(/\s+/g, " ").trim());
    count.textContent = `${length} / ${gaugeLimit}`;
    count.classList.toggle("over", length > gaugeLimit);
  }
}

function textLength(text) {
  return [...graphemes.segment(text)].length;
}

function tweenValue(element, target) {
  const from = element.shown, began = performance.now();
  element.tween = began;
  const step = (now) => {
    if (element.tween !== began) return;
    const progress = Math.min(1, (now - began) / 900);
    element.shown = from + (target - from) * (1 - Math.pow(1 - progress, 3));
    element.querySelector(".value").textContent = `${Math.round(100 * element.shown)}%`;
    if (progress < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

async function refreshGauges() {
  if (!isOn("gauges")) return;
  const goal = currentGoal(), audience = latestHeader("audience"), tone = latestHeader("tone"), text = editor.value;
  const brief = [goal, audience, tone].join("\n");
  gaugeBrief = brief;
  const request = ++gaugesRequest, began = performance.now();
  if (!goal || !text.trim()) { gauges = []; renderGauges(); return; }
  const result = await post("/gauges", { text: contentText().replace(/\s+/g, " ").trim(), goal, audience, tone }).catch(() => null);
  if (!result) { setTimeout(refreshGauges, RETRY_MS); return; }
  if (request !== gaugesRequest || gaugeBrief !== brief || editor.value !== text) return;
  gaugeTimings.push((performance.now() - began) / 1000);
  gauges = result.gauges;
  gaugeLimit = result.limit;
  renderGauges();
}

const PAGE_LOAD = Math.random().toString(36).slice(2);
const FEED_PAUSES = 10;
const FEED_ROWS = 6;
const FEED_POLL_MS = 500;
const feedPauses = document.getElementById("feed-pauses");
const feedRecords = new Map(), feedRendered = new Map();
let inputs = 0, feedVersion = 0, feedTimer = null, judged = null;

function judgedSpan(prompt) {
  for (const part of prompt.split("\n\n").reverse()) {
    const value = part.replace(/^[A-Z][\w ]*: /, "").trim();
    const start = value ? editor.value.indexOf(value) : -1;
    if (start >= 0) return { start, end: start + value.length, text: value };
  }
  return null;
}

function toggleFeed() {
  if (!isOn("feed") && !document.body.classList.contains("feed-open")) return;
  const open = document.body.classList.toggle("feed-open");
  clearInterval(feedTimer);
  if (open) { pollFeed(); feedTimer = setInterval(pollFeed, FEED_POLL_MS); }
  setTimeout(render, 360);
  saveView();
}

async function pollFeed() {
  const result = await (await fetch(`/feed?after=${feedVersion}`)).json();
  if (result.version < feedVersion) { feedVersion = 0; feedRecords.clear(); return; }
  feedVersion = result.version;
  document.getElementById("feed-decisions").textContent = result.decisions.toLocaleString();
  document.getElementById("feed-replays").textContent = result.replays ? `+${result.replays.toLocaleString()} cached` : "";
  document.getElementById("feed-median").textContent = `${result.median_seconds.toFixed(2)}s`;
  document.getElementById("feed-dollars").textContent = `$${result.dollars.toFixed(result.dollars < 0.1 ? 4 : 2)}`;
  if (!result.records.length) return;
  for (const record of result.records) feedRecords.set(record.id, record);
  renderFeed();
}

const attribute = (text) => escape(text).replace(/"/g, "&quot;");
const KINDS = { score: "Score", choice: "Choice" };
const yesNo = (question) => "yes" in question.distribution && Object.keys(question.distribution).length === 2;

function glyph(question, probability) {
  if (yesNo(question)) return `<div class="track"><b style="width: ${100 * probability}%"></b><i class="${probability > 0.4 && probability < 0.6 ? "unsure" : ""}" style="left: ${100 * probability}%"></i></div>`;
  const options = Object.entries(question.distribution);
  if (question.kind === "score") return `<div class="glyph ruler">${options.map(([level, share]) => `<i class="${level === String(question.answer) ? "pick" : ""}" style="height: ${Math.max(10, 100 * share)}%"></i>`).join("")}</div>`;
  return `<div class="glyph dots">${options.map(([option]) => `<i class="${option === String(question.answer) ? "pick" : ""}" title="${attribute(option)}"></i>`).join("")}</div>`;
}

function answerBar(question) {
  const probability = yesNo(question) ? question.distribution.yes : question.distribution[question.answer] || 0;
  return { probability, option: yesNo(question) ? "" : question.answer };
}

function renderFeed() {
  const pauses = new Map();
  for (const record of [...feedRecords.values()].sort((first, second) => first.id - second.id)) {
    if (!pauses.has(record.pause)) pauses.set(record.pause, []);
    pauses.get(record.pause).push(record);
  }
  const kept = [...pauses.keys()].slice(-FEED_PAUSES);
  for (const [id, record] of feedRecords) if (!kept.includes(record.pause)) feedRecords.delete(id);
  let row = 0;
  feedPauses.innerHTML = kept.reverse().map((pause) => {
    const records = pauses.get(pause);
    const questions = records.flatMap((record) => record.questions.map((question) => ({ question, record })));
    const replayed = questions.filter(({ record }) => record.cached).length;
    const live = records.filter((record) => !record.cached);
    const slowest = live.length ? Math.max(...live.map((record) => record.seconds)) : 0;
    const strip = questions.map(({ question, record }, index) => {
      const fresh = !feedRendered.has(record.id) ? " fresh" : "";
      return `<i class="${record.action || ""}${fresh}" style="height: ${Math.max(8, 100 * answerBar(question).probability)}%; --index: ${index}"></i>`;
    }).join("");
    const calls = records.map((record) => {
      const fresh = !feedRendered.has(record.id);
      const acted = (fresh ? ["applied", "shown"].includes(record.action) : feedRendered.get(record.id) !== record.action) ? " acted" : "";
      const ranked = record.questions.length > FEED_ROWS
        ? [...record.questions].sort((first, second) => record.decisive.includes(second.name) - record.decisive.includes(first.name) || answerBar(second).probability - answerBar(first).probability)
        : record.questions;
      const rows = ranked.slice(0, FEED_ROWS).map((question) => {
        const { probability, option } = answerBar(question);
        const key = record.decisive.includes(question.name) ? " key" : "";
        return `<div class="feed-row${key}${fresh ? " fresh" : ""}" style="--index: ${row++}" title="${attribute(question.text)}" data-ref="decision:${record.id}-${question.name}" data-ref-data="${attribute(question.text)} ${Math.round(100 * probability)}%"><div><span class="key-name">${escape(question.name)}</span><span class="text">${escape(question.text)}</span></div><div class="answer"><span class="value">${yesNo(question) ? `${Math.round(100 * probability)}% yes` : `${escape(option)} ${probability.toFixed(2)}`}</span>${glyph(question, probability)}</div><span class="kind">${KINDS[question.kind]}</span></div>`;
      }).join("");
      const more = record.questions.length > FEED_ROWS ? `<div class="feed-more">+${record.questions.length - FEED_ROWS} more</div>` : "";
      return `<div data-record="${record.id}" class="feed-call ${record.action || ""}${record.cached ? " cached" : ""}${acted}"><h4><i class="dot ${record.action || "pending"}" title="${record.action || "no action"}"></i><b>${escape(record.endpoint)}</b>${escape(record.schema)} · ${record.questions.length}<span>${record.cached ? "cache" : `${record.seconds.toFixed(2)}s`}</span></h4>${rows}${more}</div>`;
    }).join("");
    return `<section class="feed-pause"><header><span>pause ${pause}</span><b>${questions.length - replayed} decisions</b>${replayed ? `<small>+${replayed} cached</small>` : ""}<span class="seconds">${slowest.toFixed(2)} s</span></header><div class="strip">${strip}</div>${calls}</section>`;
  }).join("");
  feedRendered.clear();
  for (const record of feedRecords.values()) feedRendered.set(record.id, record.action);
}

const REF_TOKEN = /(?<![\w.])@(?:"[^"\n]*"|[\w-]+)/g;
const REF_SPAN = /[^.!?\n@]*(?<![\w.])@(?:"[^"\n]*"|[\w-]+)[^.!?\n]*[.!?]?/g;
const pendingRefs = [];
let probes = [], previousValue = "";
let claims = [];
const handledRefs = new Set();
const snapshots = new Map();
const slug = (text) => text.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 24);

function refToken(element) {
  const [kind, id] = element.dataset.ref.split(":");
  const shared = [...document.querySelectorAll("[data-ref]")].some((other) => other.dataset.ref.split(":")[1] === id && other.dataset.ref.split(":")[0] !== kind);
  const name = slug(id);
  if (/^\d/.test(name)) return `@${kind}${name}`;
  return shared ? `@${name}-${kind}` : `@${name}`;
}

function snapshotOf(element) {
  const data = Object.entries(element.dataset).filter(([key]) => key !== "ref").map(([key, value]) => `${key}: ${value}`);
  return { ref: element.dataset.ref, component: [...data, element.innerText.replace(/\s+/g, " ").trim()].join("; ") };
}

function refSnapshot(token) {
  if (snapshots.has(token)) return snapshots.get(token);
  const element = [...document.querySelectorAll("[data-ref]")].find((other) => refToken(other) === token);
  if (element) return snapshotOf(element);
  const name = token.slice(1);
  return Object.hasOwn(components, name) ? { ref: `component:${name}`, component: `${name}: ${components[name]}` } : undefined;
}

function refSpans(text, pattern) {
  return [...text.matchAll(pattern)].map((match) => ({ start: match.index, end: match.index + match[0].length, text: match[0], snapshot: refSnapshot(match[0].match(new RegExp(REF_TOKEN.source))[0]) }))
    .filter((span) => span.snapshot && span.text.trim());
}

async function handleRef(found) {
  handledRefs.add(found.text);
  const leading = found.text.length - found.text.trimStart().length;
  const span = { start: found.start + leading, end: found.end, text: found.text.trim() };
  const anchor = previousSentence(editor.value, span.start);
  const { ref, component } = found.snapshot;
  const question = span.text.replace(new RegExp(REF_TOKEN.source), "").trim();
  pendingRefs.push(span);
  const result = await post("/component", { span: span.text, question, component, text: found.snapshot.span ? found.snapshot.span.text : "", sentence: anchor.text, paragraph: editor.value.slice(Math.max(0, span.start - 400), span.start), goal: currentGoal() });
  pendingRefs.splice(pendingRefs.indexOf(span), 1);
  if (result.intent === "mention" || !stillThere(span)) return;
  const [start, end] = removalRange(editor.value, span);
  applyEdit(start, end, "", `note ${span.text}`);
  if (result.probability !== null || result.options) {
    const probe = { ...found.snapshot.span, question, probability: result.probability, options: result.options, pick: result.pick, id: probes.length + 1 };
    probes.push(probe);
    render();
    return;
  }
  const [kind, name] = ref.split(":");
  if (result.intent === "reply" && thread && thread.answer && ref === `thread:${slug(thread.question || thread.answer || "open")}`) { replyToThread(question); return; }
  if (result.intent === "set_target" && kind === "gauge" && result.target !== null && typeof setTarget === "function") { setTarget(name, result.target); return; }
  if (result.answer) {
    const target = previousSentence(editor.value, start);
    thread = { anchor: target.text ? target : anchor, question: span.text, answer: result.answer.text, measures: result.answer.measures };
    render();
    return;
  }
  const field = kind === "header" ? name : kind;
  if (FIELDS[field] && ["change", "instruction", "turn_off"].includes(result.intent)) {
    const entries = headers.filter((header) => header.field === field).map((header) => header.text);
    const edited = await post("/headers/change", { field: FIELDS[field], entries, comment: question });
    if (!edited.entries) return;
    headers = headers.filter((header) => header.field !== field).concat(edited.entries.map((text) => ({ field, text })));
    render();
    refreshGauges();
    return;
  }
  if (kind === "component" && result.intent.startsWith("turn_")) { setComponent(name, result.intent === "turn_on"); return; }
  if (kind === "component" && name === "gauges" && result.intent === "change") {
    const changed = await post("/gauges/change", { goal: currentGoal(), audience: latestHeader("audience"), tone: latestHeader("tone"), comment: question });
    if (!changed.categories) return;
    lastRequests.delete("/gauges");
    refreshGauges();
    return;
  }
  if (kind === "component") return;
  const element = document.querySelector(`[data-ref="${CSS.escape(ref)}"]`);
  if (!element) return;
  element.dispatchEvent(new CustomEvent("ref-action", { bubbles: true, detail: { ref, instruction: span.text } }));
  element.classList.add("ref-gone");
  setTimeout(() => { element.hidden = true; }, 600);
}

function renderClaims(sheet) {
  const box = document.getElementById("claims");
  const ring = 2 * Math.PI * 8;
  box.innerHTML = claims.map((claim, index) => {
    const span = backdrop.querySelector(`[data-claim="${claim.start}"]`);
    if (!span) return "";
    const rects = span.getClientRects();
    const top = rects[0].top - sheet.top + 8, line = rects[rects.length - 1].bottom - sheet.top;
    const percent = Math.round(100 * claim.probability);
    const offered = claim.correction && !declined.has(`fact ${claim.text} ${claim.correction.text}`);
    const before = claim.text.split(" "), after = offered ? claim.correction.text.split(" ") : [];
    let head = 0, tail = 0;
    while (head < Math.min(before.length, after.length) && before[head] === after[head]) head++;
    while (tail < Math.min(before.length, after.length) - head && before[before.length - 1 - tail] === after[after.length - 1 - tail]) tail++;
    const swap = offered ? `<button class="swap" data-claim-swap="${index}" title="${escape(claim.correction.text).replace(/"/g, "&quot;")} · ${Math.round(100 * claim.correction.probability)}% true">${escape(after.slice(head, after.length - tail).join(" ") || claim.correction.text)}</button>` : "";
    return `<div class="claim" data-line="${line}" style="top: ${top}px"><div class="probe" style="position: static" data-ref="fact:${index + 1}" data-ref-data="${escape(`${percent}% true: "${claim.text}"`).replace(/"/g, "&quot;")}" title="${escape(claim.text).replace(/"/g, "&quot;")}"><svg viewBox="0 0 22 22"><circle class="track" cx="11" cy="11" r="8" fill="none" stroke-width="3"/><circle class="level" cx="11" cy="11" r="8" fill="none" stroke-width="3" stroke-linecap="round" stroke-dasharray="${ring}" stroke-dashoffset="${ring * (1 - claim.probability)}"/></svg>${percent}%</div>${swap}</div>`;
  }).join("");
}

document.getElementById("claims").addEventListener("mousedown", (event) => { if (event.target.closest(".swap")) event.preventDefault(); });
document.getElementById("claims").addEventListener("click", (event) => {
  const button = event.target.closest(".swap");
  if (!button) return;
  const claim = claims[Number(button.dataset.claimSwap)];
  if (!claim || !stillThere(claim)) return;
  const replacement = claim.correction.text;
  applyEdit(claim.start, claim.end, replacement, `fact ${claim.text} ${replacement}`);
  const flash = { start: claim.start, end: claim.start + replacement.length, text: replacement };
  flashes.push(flash);
  setTimeout(() => { flashes = flashes.filter((other) => other !== flash); render(); }, FLASH_MS);
  claims = claims.filter((other) => other !== claim);
  render();
});

function renderProbes(sheet) {
  const box = document.getElementById("probes");
  const ring = 2 * Math.PI * 8;
  box.innerHTML = probes.map((probe) => {
    const span = backdrop.querySelector(`[data-probe="${probe.id}"]`);
    if (!span) return "";
    const rects = span.getClientRects();
    const top = rects[0].top - sheet.top + 8, line = rects[rects.length - 1].bottom - sheet.top;
    if (probe.options) return `<div class="probe" data-ref="probe:${probe.id}" data-ref-data="${attribute(`"${probe.pick}" of ${probe.options.join(", ")} for "${probe.question}" about "${probe.text}"`)}" title="${attribute(probe.question)}" data-line="${line}" style="top: ${top}px"><span class="dots">${probe.options.map((option) => `<i class="${option === probe.pick ? "pick" : ""}" title="${attribute(option)}"></i>`).join("")}</span>${escape(probe.pick)}</div>`;
    return `<div class="probe" data-ref="probe:${probe.id}" data-ref-data="${escape(`P(yes) ${Math.round(100 * probe.probability)}% on "${probe.question}" about "${probe.text}"`).replace(/"/g, "&quot;")}" title="${escape(probe.question).replace(/"/g, "&quot;")}" data-line="${line}" style="top: ${top}px"><svg viewBox="0 0 22 22"><circle class="track" cx="11" cy="11" r="8" fill="none" stroke-width="3"/><circle class="level" cx="11" cy="11" r="8" fill="none" stroke-width="3" stroke-linecap="round" stroke-dasharray="${ring}" stroke-dashoffset="${ring * (1 - probe.probability)}"/></svg>${Math.round(100 * probe.probability)}%</div>`;
  }).join("");
}

function trackRanges() {
  const before = previousValue, after = editor.value;
  previousValue = after;
  let prefix = 0;
  while (prefix < before.length && before[prefix] === after[prefix]) prefix += 1;
  let suffix = 0;
  while (suffix < before.length - prefix && before[before.length - 1 - suffix] === after[after.length - 1 - suffix]) suffix += 1;
  const removedEnd = before.length - suffix, shift = after.length - before.length;
  for (const range of [thread?.anchor, ...flashes, ...reactions, ...probes, ...claims, ...pendingRefs].filter(Boolean)) {
    if (removedEnd <= range.start) { range.start += shift; range.end += shift; }
    else if (prefix < range.end) range.end = Math.max(range.start, range.end + shift);
  }
  probes = probes.filter((probe) => probe.end > probe.start);
}

async function rescoreProbes() {
  if (!isOn("probes")) return;
  for (const probe of probes) {
    const text = editor.value.slice(probe.start, probe.end);
    if (text === probe.text || probe.options) continue;
    probe.text = text;
    const result = await post("/probe", { question: probe.question, text });
    if (probe.text === text) { probe.probability = result.probability; render(); }
  }
}

editor.addEventListener("copy", (event) => {
  const { selectionStart: start, selectionEnd: end } = editor;
  const text = editor.value.slice(start, end);
  if (!text.trim()) return;
  const words = text.replace(/[".!?\n]/g, " ").trim().split(/\s+/);
  const token = `@"${words.slice(0, 3).join(" ")}"`;
  snapshots.set(token, { ref: `span:${start}`, component: `the writer's text: "${text}"`, span: { start, end, text } });
  event.clipboardData.setData("text/plain", token + " ");
  event.preventDefault();
  const flash = { start, end, text };
  flashes.push(flash);
  setTimeout(() => { flashes = flashes.filter((other) => other !== flash); render(); }, FLASH_MS);
  render();
});

document.addEventListener("click", (event) => {
  const element = event.target.closest("[data-ref]");
  if (!element || event.target.closest("button")) return;
  const token = refToken(element);
  snapshots.set(token, snapshotOf(element));
  navigator.clipboard.writeText(token + " ");
  element.animate([{ outline: "2px solid rgb(var(--thread))", outlineOffset: "2px" }, { outline: "2px solid transparent", outlineOffset: "8px" }], { duration: 600, easing: "ease-out" });
});

const PAGES_KEY = "jevflow.pages", CURRENT_PAGE_KEY = "jevflow.currentPage", SAVE_MS = 500;
const savedDot = document.getElementById("saved");
const pageList = document.getElementById("page-list");
let currentPage = Date.now().toString(36), saveTimer, caretTimer, lastSaved = "";

function readPages() {
  try { return JSON.parse(localStorage.getItem(PAGES_KEY)) || {}; } catch { return {}; }
}

const pageParts = {
  reactions: {
    save: () => reactions.map(({ element, ...reaction }) => reaction),
    restore: (saved = []) => { for (const reaction of reactions) reaction.element?.remove(); reactions = saved.filter(stillThere); },
  },
  flags: { save: () => insights, restore: (saved = []) => { insights = saved.filter(stillThere); } },
  probes: { save: () => probes, restore: (saved = []) => { probes = saved.filter(stillThere); } },
  claims: { save: () => claims, restore: (saved = []) => { claims = saved.filter(stillThere); } },
  gauges: {
    save: () => ({ gauges, limit: gaugeLimit, brief: gaugeBrief }),
    restore: (saved) => { gauges = saved?.gauges || []; gaugeLimit = saved?.limit ?? null; gaugeBrief = saved?.brief || ""; renderGauges(); },
  },
};

function pageState() {
  const kept = thread && thread.answer !== undefined ? thread : null;
  return JSON.stringify({
    text: editor.value, headers,
    thread: kept && { anchor: kept.anchor, question: kept.question, answer: kept.answer, measures: kept.measures, reply: kept.reply, comment: kept.comment, replacement: kept.replacement, status: kept.status === "…" ? "" : kept.status },
    parts: Object.fromEntries(Object.entries(pageParts).map(([name, part]) => [name, part.save()])),
  });
}

function savePage() {
  const state = pageState();
  if (state === lastSaved) return;
  const pages = readPages();
  const titled = pages[currentPage]?.titledBy && pages[currentPage].titledBy !== "auto" ? pages[currentPage] : null;
  pages[currentPage] = {
    title: titled ? titled.title : currentGoal() || editor.value.trim().split(/\s+/).slice(0, 6).join(" ") || "New page", titledBy: titled ? titled.titledBy : "auto",
    updatedAt: Date.now(), state: JSON.parse(state), caret: [editor.selectionStart, editor.selectionEnd],
  };
  try {
    localStorage.setItem(PAGES_KEY, JSON.stringify(pages));
    localStorage.setItem(CURRENT_PAGE_KEY, currentPage);
  } catch { return; }
  lastSaved = state;
  savedDot.classList.remove("landed");
  void savedDot.offsetWidth;
  savedDot.classList.add("landed");
  renderPages(pages);
}

function setPageTitle(id, title, titledBy) {
  const pages = readPages();
  if (!pages[id]) return;
  Object.assign(pages[id], { title, titledBy });
  try { localStorage.setItem(PAGES_KEY, JSON.stringify(pages)); } catch { return; }
  renderPages(pages);
}

function saveCaret() {
  const pages = readPages();
  if (!pages[currentPage]) return;
  pages[currentPage].caret = [editor.selectionStart, editor.selectionEnd];
  try { localStorage.setItem(PAGES_KEY, JSON.stringify(pages)); } catch {}
}

const titleChecks = new Map();

async function retitle() {
  if (!isOn("titles")) return;
  const pages = readPages();
  const text = (id) => (id === currentPage ? editor.value.slice(0, typingStart()) : pages[id].state.text).trim();
  const due = (id) => pages[id] && pages[id].titledBy !== "writer" && text(id) && titleChecks.get(id) !== text(id);
  const id = due(currentPage) ? currentPage : Object.keys(pages).find((other) => due(other) && Object.entries(pages).some(([another, page]) => another !== other && page.title === pages[other].title));
  if (!id) return;
  titleChecks.set(id, text(id));
  const others = Object.entries(pages).filter(([other]) => other !== id).map(([, page]) => page.title);
  const result = await post("/title", { text: text(id), title: pages[id].title, others });
  if (!result.title) return;
  setPageTitle(id, result.title, "picked");
  pageList.querySelector(`[data-page="${CSS.escape(id)}"]`)?.classList.add("retitled");
}

function renderPages(pages) {
  pageList.innerHTML = Object.entries(pages).sort(([, first], [, second]) => second.updatedAt - first.updatedAt)
    .map(([id, page]) => `<li data-page="${attribute(id)}" class="${id === currentPage ? "current" : ""}" title="${attribute(page.title)}">${escape(page.title)}</li>`).join("");
}

function loadPage(id, state) {
  clearTimeout(saveTimer);
  savePage();
  currentPage = id;
  editor.value = previousValue = state.text;
  headers = state.headers;
  thread = state.thread;
  for (const [name, part] of Object.entries(pageParts)) part.restore(state.parts?.[name]);
  notes = []; flashes = []; history = []; pendingFixes = []; pendingSuggestions = [];
  declined.clear();
  render();
  const stored = readPages()[id];
  const [start, end] = (stored?.caret || [state.text.length, state.text.length]).map((offset) => Math.min(offset, state.text.length));
  editor.focus({ preventScroll: true });
  editor.setSelectionRange(start, end);
  const rect = characterRect(Math.max(0, Math.min(start, state.text.length - 1)));
  if (rect) window.scrollBy(0, rect.top - window.innerHeight / 2);
  lastSaved = stored ? pageState() : "";
  savePage();
  try { localStorage.setItem(CURRENT_PAGE_KEY, id); } catch {}
  renderPages(readPages());
}

function openNewPage(seedHeaders) {
  loadPage(Date.now().toString(36), { text: "", headers: seedHeaders, thread: null });
}

function restorePage() {
  let stored = null;
  try { stored = localStorage.getItem(CURRENT_PAGE_KEY); } catch {}
  const pages = readPages();
  const [newest] = Object.keys(pages).sort((first, second) => pages[second].updatedAt - pages[first].updatedAt);
  const id = pages[stored] ? stored : newest;
  if (!id) return;
  lastSaved = pageState();
  loadPage(id, pages[id].state);
}

pageList.addEventListener("click", (event) => {
  const id = event.target.closest("[data-page]")?.dataset.page;
  const page = id && id !== currentPage && readPages()[id];
  if (page) loadPage(id, page.state);
});
document.getElementById("new-page").addEventListener("click", () => openNewPage([]));
document.addEventListener("selectionchange", () => {
  if (document.activeElement !== editor) return;
  clearTimeout(caretTimer);
  caretTimer = setTimeout(saveCaret, SAVE_MS);
});
document.getElementById("pages-toggle").addEventListener("click", () => { document.body.classList.toggle("pages-open"); setTimeout(render, 360); saveView(); });

const VIEW_KEY = "jevflow.view";
let view = null;
try { view = JSON.parse(localStorage.getItem(VIEW_KEY)); } catch {}

function saveView() {
  try { localStorage.setItem(VIEW_KEY, JSON.stringify({ feed: document.body.classList.contains("feed-open"), pages: document.body.classList.contains("pages-open") })); } catch {}
}

if (view ? view.pages : window.innerWidth > 1100) document.body.classList.add("pages-open");
if (view?.feed) toggleFeed();

const COLLAPSED_KEY = "jevflow.componentsCollapsed";
const componentsPanel = document.getElementById("components-panel");
const componentsHeader = componentsPanel.querySelector("h3");
const componentList = document.getElementById("component-list");
let markedRow = null, outlinedFrames = [], componentUses = {};
try { componentsPanel.classList.toggle("collapsed", localStorage.getItem(COLLAPSED_KEY) === "true"); } catch {}

function componentOrder(uses) {
  return Object.keys(components).sort((first, second) => (uses[second] || 0) - (uses[first] || 0));
}

function renderComponents() {
  componentList.innerHTML = componentOrder(componentUses).map((name) => `<li data-ref="component:${attribute(name)}" data-ref-data="${attribute(components[name])}" class="${isOn(name) ? "" : "off"}" title="${attribute(components[name])}">${escape(name)}</li>`).join("");
}

async function sortComponents() {
  const uses = await (await fetch("/feed/uses")).json();
  if (componentsPanel.matches(":hover") || componentOrder(uses).join() === componentOrder(componentUses).join()) return;
  componentUses = uses;
  renderComponents();
}

function componentMark(name) {
  if (componentsPanel.classList.contains("collapsed")) return componentsHeader;
  return componentList.querySelector(`[data-ref="component:${CSS.escape(name)}"]`);
}

function outlineComponent(name) {
  for (const frame of outlinedFrames) frame.classList.remove("outlined");
  const frames = name ? [...document.querySelectorAll(`[data-ref="component:${CSS.escape(name)}"]`)].filter((frame) => !componentList.contains(frame) && frame.childElementCount) : [];
  outlinedFrames = frames.flatMap((frame) => frame.offsetHeight ? [frame] : [...frame.children]);
  for (const frame of outlinedFrames) frame.classList.add("outlined");
}

componentsHeader.addEventListener("click", () => {
  const collapsed = componentsPanel.classList.toggle("collapsed");
  try { localStorage.setItem(COLLAPSED_KEY, collapsed); } catch {}
});
componentList.addEventListener("click", (event) => {
  const name = event.target.closest("[data-ref]")?.dataset.ref.split(":")[1];
  if (name) setComponent(name, !isOn(name));
});
componentList.addEventListener("mouseover", (event) => outlineComponent(event.target.closest("[data-ref]")?.dataset.ref.split(":")[1]));
componentList.addEventListener("mouseleave", () => outlineComponent(null));
document.addEventListener("mouseover", (event) => {
  const frame = componentsPanel.contains(event.target) ? null : event.target.closest('[data-ref^="component:"]');
  markedRow?.classList.remove("marked");
  markedRow = frame && componentMark(frame.dataset.ref.split(":")[1]);
  markedRow?.classList.add("marked");
});
window.addEventListener("components-loaded", renderComponents);
window.addEventListener("component-toggle", (event) => {
  renderComponents();
  const mark = componentMark(event.detail.name);
  mark?.classList.remove("toggled");
  void mark?.offsetWidth;
  mark?.classList.add("toggled");
});

restorePage();
render();
</script>
</body>
</html>
